<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>ICD audit – đo phản hồi</title>
<style>html,body{margin:0;height:100%;overflow:auto}body{font:14px/1.5 system-ui;display:grid;grid-template-rows:auto minmax(0,1fr)}header{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}iframe{width:100%;height:100%;min-height:0;border:0}pre{white-space:pre-wrap}button,select{padding:8px}</style></head>
<body><header><label for="group">Nhóm thao tác</label><select id="group"><option value="navigation">navigation</option><option value="dialog">dialog</option><option value="selection">selection</option><option value="filter">filter</option><option value="submit">submit</option></select><button id="arm" type="button">Chuẩn bị đo</button><button id="summary" type="button">Tổng hợp mẫu</button><span id="state" role="status">Đang mở ứng dụng</span><span id="count">0 mẫu</span></header>
<iframe id="app" title="ICD test backend3001" src="/app/containers"></iframe><pre id="result" hidden></pre><pre id="calibration" hidden></pre><pre id="diagnostics" hidden></pre>
<script type="module">
import {instrumentDocument,measureFrameCadence,observeDiagnostics} from '__SENSOR_URL__';
import {summarize} from '__METRICS_URL__';
const frame=document.getElementById('app'),state=document.getElementById('state'),records=[];
let sensor,disposeDiagnostics;const diagnostics=[];
const render=()=>{document.getElementById('count').textContent=records.length+' mẫu';document.getElementById('result').textContent=JSON.stringify({scope:'Local trusted input → feedback across two render frames; not field INP',records},null,2);};
const attach=()=>{sensor?.dispose();disposeDiagnostics?.();sensor=instrumentDocument(frame.contentDocument,{onRecord:record=>{records.push(record);render();},onState:value=>{state.textContent=value;}});disposeDiagnostics=observeDiagnostics(frame.contentDocument,record=>diagnostics.push(record));state.textContent='Sensor sẵn sàng';};
frame.addEventListener('load',attach);
document.getElementById('arm').onclick=()=>{try{sensor.arm(document.getElementById('group').value);}catch(error){state.textContent=error.message;}};
document.getElementById('summary').onclick=()=>{try{document.getElementById('result').textContent=JSON.stringify({at:new Date().toISOString(),...summarize(records,['navigation','dialog','selection','filter','submit']),records},null,2);document.getElementById('diagnostics').textContent=JSON.stringify(diagnostics,null,2);}catch(error){state.textContent=error.message;}};
render();
const widthLabel=document.createElement('label');widthLabel.htmlFor='app-width';widthLabel.textContent='Chiều rộng ứng dụng';
const widthSelect=document.createElement('select');widthSelect.id='app-width';
for(const value of ['auto','320','375','768','1440']){const option=document.createElement('option');option.value=value;option.textContent=value==='auto'?'Theo khung browser':value+'px';widthSelect.append(option);}
document.querySelector('header').append(widthLabel,widthSelect);
widthSelect.onchange=()=>{frame.style.width=widthSelect.value==='auto'?'100%':widthSelect.value+'px';};
const calibrate=document.createElement('button');calibrate.type='button';calibrate.textContent='Hiệu chuẩn khung hình';
document.querySelector('header').append(calibrate);
calibrate.onclick=async()=>{calibrate.disabled=true;state.textContent='Đang hiệu chuẩn';try{document.getElementById('calibration').textContent=JSON.stringify({at:new Date().toISOString(),...await measureFrameCadence(frame.contentWindow)},null,2);state.textContent='Đã hiệu chuẩn';}catch(error){state.textContent=error.message;}finally{calibrate.disabled=false;}};
if(frame.contentDocument?.readyState==='complete' && frame.contentWindow.location.origin==='http://127.0.0.1:5174' && frame.contentWindow.location.pathname.startsWith('/app/'))attach();
// Passive measurements only: no field values or business writes are generated here.
const pointerRecords=[],pointerOutput=document.createElement('pre');pointerOutput.id='pointer-states';pointerOutput.hidden=true;document.body.append(pointerOutput);
const traceOutput=document.createElement('pre');traceOutput.id='read-trace';traceOutput.hidden=true;document.body.append(traceOutput);
const traceButton=document.createElement('button');traceButton.type='button';traceButton.textContent='Đo tải lại ứng dụng';document.querySelector('header').append(traceButton);
let traceArmed=false,disposeTrace;let traceRecords=[],traceOrigin;
const startTrace=()=>{disposeTrace?.();const doc=frame.contentDocument,win=doc.defaultView;traceOrigin=win.performance.now();let lastKey='';const capture=()=>{const visible=e=>e.getClientRects().length&&win.getComputedStyle(e).visibility==='visible';const main=doc.querySelector('main');const headings=[...(main?.querySelectorAll('h1,h2,h3')||[])].filter(visible).map(e=>e.textContent.trim().slice(0,180));const statuses=[...(main?.querySelectorAll('[role="status"],[role="alert"]')||[])].filter(visible).map(e=>e.textContent.trim().slice(0,250));const rows=[...(main?.querySelectorAll('tbody tr')||[])].filter(visible);const knownRows=rows.filter(e=>/AUDU4246647|UXT1004D timing Shipping01|AUD25157BF4 Audit Shipping/.test(e.textContent)).map(e=>e.textContent.trim().slice(0,120));const snapshot={elapsedMs:win.performance.now()-traceOrigin,at:new Date().toISOString(),path:win.location.pathname,view:main?.querySelector('[data-view]:not([hidden])')?.getAttribute('data-view')||null,headings,statuses,rowCount:rows.length,knownRows};const key=JSON.stringify({...snapshot,at:undefined,elapsedMs:undefined});if(key===lastKey)return;lastKey=key;if(traceRecords.length<2500)traceRecords.push(snapshot);traceOutput.textContent=JSON.stringify({scope:'Visible loading/resource transitions in the actual authenticated app; 50ms polling starts at iframe load, not navigation start',at:new Date().toISOString(),truncated:traceRecords.length>=2500,records:traceRecords},null,2);};const timer=win.setInterval(capture,50);capture();disposeTrace=()=>win.clearInterval(timer);};
frame.addEventListener('load',()=>{if(traceArmed)startTrace();});
traceButton.onclick=()=>{traceArmed=true;traceRecords=[];frame.src=frame.getAttribute('src');state.textContent='Đang đo tải lại';};
const pointerArm=document.createElement('button');pointerArm.type='button';pointerArm.textContent='Chuẩn bị đo trạng thái';document.querySelector('header').append(pointerArm);
let disposePointer,baseline;
const readPointerStyle=element=>{const s=element.ownerDocument.defaultView.getComputedStyle(element);return{tag:element.localName,name:element.getAttribute('aria-label')||(element.localName==='button'||element.localName==='a'?element.textContent.trim().slice(0,100):element.getAttribute('placeholder')||''),class:element.getAttribute('class'),hover:element.matches(':hover'),active:element.matches(':active'),focus:element.matches(':focus'),disabled:element.matches(':disabled')||element.getAttribute('aria-disabled')==='true',filter:s.filter,background:s.backgroundColor,color:s.color,border:s.borderColor,outline:s.outline,transition:s.transitionDuration,transitionProperty:s.transitionProperty,easing:s.transitionTimingFunction};};
const outputPointer=()=>{pointerOutput.textContent=JSON.stringify({scope:'Trusted mousedown plus settled native hover on actual controls; no synthetic events',at:new Date().toISOString(),records:pointerRecords},null,2);};
const tracePointerFrames=(target,record)=>{const win=target.ownerDocument.defaultView,start=win.performance.now();record.frames=[];const capture=()=>{if(!target.isConnected){record.frameTraceDisconnected=true;return;}record.frames.push({elapsedMs:win.performance.now()-start,...readPointerStyle(target)});if(record.frames.length<60&&win.performance.now()-start<220)win.requestAnimationFrame(capture);else{record.frameTraceComplete=true;outputPointer();}};win.requestAnimationFrame(capture);};
pointerArm.onclick=()=>{disposePointer?.();const doc=frame.contentDocument;baseline=[...doc.querySelectorAll('button,a,input,select,textarea,[role="button"]')].filter(e=>e.getClientRects().length).map(readPointerStyle);const listener=event=>{const target=event.target.closest('button,a,input,select,textarea,[role="button"]');if(!target||!event.isTrusted)return;const down=readPointerStyle(target);const candidates=baseline.filter(b=>b.tag===down.tag&&b.name===down.name&&b.class===down.class);const comparable=candidates.length>0&&candidates.every(b=>['filter','background','color','border'].every(key=>b[key]===candidates[0][key]));const record={at:new Date().toISOString(),eventType:event.type,trusted:event.isTrusted,width:doc.defaultView.innerWidth,path:doc.defaultView.location.pathname,before:comparable?candidates[0]:null,baselineComparable:comparable,pointerdown:down};pointerRecords.push(record);tracePointerFrames(target,record);outputPointer();setTimeout(()=>{record.after=target.isConnected?readPointerStyle(target):null;record.sameClass=record.after?.class===record.before?.class;outputPointer();state.textContent='Đã đo trạng thái '+pointerRecords.length;},250);};doc.addEventListener('mousedown',listener,true);disposePointer=()=>doc.removeEventListener('mousedown',listener,true);state.textContent='Đã chuẩn bị đo trạng thái';};
</script></body></html>
